<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ED Wingman</title>
  <link rel="stylesheet" href="overlay.css" />
  <script src="overlay.js" defer></script>
</head>
<body>
  <main id="panel">
    <header>
      <span class="mark">Wingman</span>
      <span id="cmdr">-</span>
    </header>

    <p id="notice" role="status" hidden></p>

    <section class="location">
      <h1 id="system">-</h1>
      <p id="place">-</p>
    </section>

    <dl>
      <div><dt>Ship</dt><dd id="ship">-</dd></div>
      <div><dt>Credits</dt><dd id="credits">-</dd></div>
      <div class="wide">
        <dt>Cargo</dt><dd id="cargo">-</dd>
        <div class="bar" aria-hidden="true"><span id="cargo-fill"></span></div>
      </div>
    </dl>

    <p id="layout-hint">Drag to move. Ctrl+Alt+L to lock.</p>
  </main>
</body>
</html>
